[mgr]
cwd = { fg = "#A3FF47", bold = true }
hovered = { fg = "#000000", bg = "#A3FF47", bold = true }
preview_hovered = { underline = true }
find_keyword = { fg = "#FBBF24", bold = true, italic = true }
find_position = { fg = "#A78BFA", bg = "reset", bold = true }
marker_copied = { fg = "#A3FF47", bg = "#A3FF47" }
marker_cut = { fg = "#FF6B7A", bg = "#FF6B7A" }
marker_marked = { fg = "#22D3EE", bg = "#22D3EE" }
marker_selected = { fg = "#FBBF24", bg = "#FBBF24" }
tab_active = { fg = "#000000", bg = "#A3FF47", bold = true }
tab_inactive = { fg = "#A6B4B9", bg = "#121B21" }
border_symbol = "│"
border_style = { fg = "#2F414B" }

[mode]
normal_main = { fg = "#000000", bg = "#A3FF47", bold = true }
normal_alt = { fg = "#E8F0F2", bg = "#121B21" }
select_main = { fg = "#000000", bg = "#22D3EE", bold = true }
select_alt = { fg = "#E8F0F2", bg = "#121B21" }
unset_main = { fg = "#000000", bg = "#FBBF24", bold = true }
unset_alt = { fg = "#E8F0F2", bg = "#121B21" }

[status]
