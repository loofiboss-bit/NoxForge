separator_close = ""
progress_label = { fg = "#E8F0F2", bold = true }
progress_normal = { fg = "#A3FF47", bg = "#0A0F13" }
progress_error = { fg = "#FF6B7A", bg = "#0A0F13" }
perm_type = { fg = "#22D3EE" }
perm_read = { fg = "#FBBF24" }
perm_write = { fg = "#FF6B7A" }
