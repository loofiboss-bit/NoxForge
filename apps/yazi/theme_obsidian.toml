[filetype]
rules = [
  { mime = "image/*", fg = "#22D3EE" },
  { mime = "video/*", fg = "#A78BFA" },
  { mime = "audio/*", fg = "#FBBF24" },
  { name = "*/", fg = "#A3FF47", bold = true }
]
