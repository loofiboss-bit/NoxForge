<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #E8F0F2; }
      .ColorScheme-Highlight { color: #A3FF47; }
      .ColorScheme-NeutralText { color: #FBBF24; }
      .ColorScheme-PositiveText { color: #A3FF47; }
      .ColorScheme-NegativeText { color: #FF6B7A; }
      .text-fill { color: #E8F0F2; fill: currentColor; fill-opacity: 0.86; stroke: none; }
      .accent { color: #A3FF47; stroke: currentColor; stroke-opacity: 0.68; }
      .accent-fill { color: #A3FF47; fill: currentColor; fill-opacity: 0.75; stroke: none; }
      .dimmed { opacity: 0.25; stroke: currentColor; }
      .dimmed-fill { opacity: 0.22; fill: currentColor; stroke: none; }
      .symbolic-ring { opacity: 0.35; stroke: currentColor; stroke-width: 1; }
      .warning { color: #FBBF24; stroke: currentColor; stroke-opacity: 0.8; }
      .warning-fill { color: #FBBF24; fill: currentColor; fill-opacity: 0.8; stroke: none; }
      .negative { color: #FF6B7A; stroke: currentColor; stroke-opacity: 0.8; }
      .negative-fill { color: #FF6B7A; fill: currentColor; fill-opacity: 0.8; stroke: none; }
    </style>
  </defs>
  <g fill="none" stroke="currentColor" class="ColorScheme-Text" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
    <rect class="ColorScheme-Text text-fill" x="3" y="17.0" width="2.4" height="3.0" rx="0.6"/><rect class="ColorScheme-Text text-fill" x="7" y="13.5" width="2.4" height="6.5" rx="0.6"/><rect class="dimmed-fill" x="11" y="10.0" width="2.4" height="10.0" rx="0.6"/><rect class="dimmed-fill" x="15" y="6.5" width="2.4" height="13.5" rx="0.6"/><rect class="dimmed-fill" x="19" y="3.0" width="2.4" height="17.0" rx="0.6"/>
  </g>
</svg>
