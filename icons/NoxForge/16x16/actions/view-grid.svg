<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #E8F0F2; }
      .ColorScheme-Highlight { color: #A3FF47; }
      .ColorScheme-NeutralText { color: #748289; }
      .ColorScheme-PositiveText { color: #A3FF47; }
      .ColorScheme-NegativeText { color: #FF6B7A; }
      .accent { stroke: #A3FF47; }
      .accent-fill { fill: #A3FF47; stroke: none; }
      .dimmed { opacity: 0.25; stroke: currentColor; }
      .negative { stroke: #FF6B7A; }
      .negative-fill { fill: #FF6B7A; stroke: none; }
    </style>
  </defs>
  <g fill="none" stroke="currentColor" class="ColorScheme-Text" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><path class="accent" d="M14 3h7"/>
  </g>
</svg>
