<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #E8F0F2; }
      .ColorScheme-Highlight { color: #A3FF47; }
      .ColorScheme-NeutralText { color: #FBBF24; }
      .ColorScheme-PositiveText { color: #A3FF47; }
      .ColorScheme-NegativeText { color: #FF6B7A; }
      .glass-fill { color: #E8F0F2; fill: currentColor; fill-opacity: 0.10; stroke: none; }
      .accent { color: #A3FF47; stroke: currentColor; }
      .accent-fill { color: #A3FF47; fill: currentColor; stroke: none; }
      .accent-soft { color: #A3FF47; fill: currentColor; fill-opacity: 0.18; stroke: none; }
      .dimmed { opacity: 0.25; stroke: currentColor; }
      .dimmed-fill { color: #E8F0F2; fill: currentColor; fill-opacity: 0.14; stroke: none; }
      .symbolic-ring { opacity: 0.45; stroke: currentColor; stroke-width: 1; }
      .warning { color: #FBBF24; stroke: currentColor; }
      .warning-fill { color: #FBBF24; fill: currentColor; stroke: none; }
      .warning-soft { color: #FBBF24; fill: currentColor; fill-opacity: 0.18; stroke: none; }
      .negative { color: #FF6B7A; stroke: currentColor; }
      .negative-fill { color: #FF6B7A; fill: currentColor; stroke: none; }
      .negative-soft { color: #FF6B7A; fill: currentColor; fill-opacity: 0.18; stroke: none; }
    </style>
  <style id="noxforge-motion" type="text/css">
    @media (prefers-reduced-motion: no-preference) {
      @keyframes nf-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @keyframes nf-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes nf-wave { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      .nf-pulse { animation: nf-pulse 1.4s ease-in-out infinite; }
      .nf-spin { transform-origin: 12px 12px; animation: nf-spin 1.2s linear infinite; }
      .nf-wave-1 { animation: nf-wave 1.8s ease-in-out 0s infinite; }
      .nf-wave-2 { animation: nf-wave 1.8s ease-in-out 0.2s infinite; }
      .nf-wave-3 { animation: nf-wave 1.8s ease-in-out 0.4s infinite; }
    }
  </style>
  </defs>
  <g fill="none" stroke="currentColor" class="ColorScheme-Text" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect class="ColorScheme-Highlight accent-fill" x="3" y="16.8" width="2.5" height="3.2" rx="1.1"/><rect class="ColorScheme-Highlight accent-fill" x="7" y="13.4" width="2.5" height="6.6" rx="1.1"/><rect class="ColorScheme-Highlight accent-fill" x="11" y="10.0" width="2.5" height="10.0" rx="1.1"/><rect class="dimmed-fill" x="15" y="6.600000000000001" width="2.5" height="13.399999999999999" rx="1.1"/><rect class="dimmed-fill" x="19" y="3.1999999999999993" width="2.5" height="16.8" rx="1.1"/><circle class="accent-soft" cx="6" cy="6" r="3"/><circle class="ColorScheme-Highlight accent-fill nf-pulse" cx="6" cy="6" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
