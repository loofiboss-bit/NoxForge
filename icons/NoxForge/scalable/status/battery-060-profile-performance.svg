    <rect x="3" y="6" width="16" height="12" rx="2.5"/><path d="M19 10h2v4h-2"/><rect class="ColorScheme-Highlight accent-fill" x="5" y="8" width="7.2" height="8" rx="1"/><path class="ColorScheme-NeutralText warning" d="M15.5 20l2.5-3 2.5 3"/>
  </g>
</svg>
