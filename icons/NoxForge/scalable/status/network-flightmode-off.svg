<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #E8F0F2; }
      .ColorScheme-Highlight { color: #A3FF47; }
      .ColorScheme-NeutralText { color: #FBBF24; }
      .ColorScheme-PositiveText { color: #A3FF47; }
      .ColorScheme-NegativeText { color: #FF6B7A; }
      .glass-fill { color: #E8F0F2; fill: currentColor; fill-opacity: 0.10; stroke: none; }
      .accent { color: #A3FF47; stroke: currentColor; }
      .accent-fill { color: #A3FF47; fill: currentColor; stroke: none; }
      .accent-soft { color: #A3FF47; fill: currentColor; fill-opacity: 0.18; stroke: none; }
      .dimmed { opacity: 0.25; stroke: currentColor; }
      .dimmed-fill { color: #E8F0F2; fill: currentColor; fill-opacity: 0.14; stroke: none; }
      .symbolic-ring { opacity: 0.45; stroke: currentColor; stroke-width: 1; }
      .warning { color: #FBBF24; stroke: currentColor; }
      .warning-fill { color: #FBBF24; fill: currentColor; stroke: none; }
      .warning-soft { color: #FBBF24; fill: currentColor; fill-opacity: 0.18; stroke: none; }
      .negative { color: #FF6B7A; stroke: currentColor; }
      .negative-fill { color: #FF6B7A; fill: currentColor; stroke: none; }
      .negative-soft { color: #FF6B7A; fill: currentColor; fill-opacity: 0.18; stroke: none; }
    </style>
  </defs>
  <g fill="none" stroke="currentColor" class="ColorScheme-Text" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path class="dimmed" d="M12 2.5v6.5l8 4v2l-8-2v5l3 2v1l-3-1-3 1v-1l3-2v-5l-8 2v-2l8-4V2.5z"/><path class="ColorScheme-NegativeText negative" d="M4 4l16 16"/>
  </g>
</svg>
