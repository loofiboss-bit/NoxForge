name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast preflight checks (<3m)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install preflight tooling
        run: |
          pip install ruff pytest pytest-subtests defusedxml

      - name: Python lint (ruff)
        run: ruff check scripts tools tests

      - name: Shell script syntax
        run: |
          bash -n scripts/*.sh
          shellcheck scripts/*.sh

      - name: Version sync check
        run: python3 scripts/sync_version.py --check

      - name: Design system & QML variants check
        run: python3 scripts/generate_design_system.py --check

      - name: Fast validation checks
        run: python3 scripts/validate.py --only version,tokens,motion_contract,color_schemes,konsole,metadata,repository_urls,qml_variants,no_package_symlinks

      - name: Active Python test suite
        run: pytest -q

  release-gate:
    name: Fedora 44 release gate
    needs: preflight
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install declared dependencies
        run: >-
          dnf install -y
          breeze-icon-theme
          cmake
          ffmpeg-free
          gcc-c++
          git
          glibc-langpack-en
          google-noto-sans-fonts
          ImageMagick
          kf6-kirigami
          libasan
          libubsan
          ninja-build
          plasma-workspace
          python3
          qt6-qtbase-devel
          qt6-qtdeclarative-devel
          rpm-build
          rpmlint
          xz
          python3-pip

      - name: Install Python dependencies
        run: pip install defusedxml

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run the authoritative release gate
        shell: bash
        run: |
          mkdir -p build/baseline-source
          baseline_commit=$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('distribution/release-manifest.json').read_text())['release']['baseline']['commit'])
          PY
          )
          git -c safe.directory="$PWD" archive "$baseline_commit" | tar -x -C build/baseline-source
          python3 scripts/release-check.py --baseline-source build/baseline-source

  gzip-determinism:
    name: Canonical gzip on Python ${{ matrix.python }}
    needs: preflight
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.12"
          - "3.14"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Verify committed Aurorae streams
        run: python -m unittest tests.test_phase3.PhaseThreeTests.test_aurorae_compression_is_reproducible -v
