name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact signed or annotated release tag
        required: true
        type: string
      publish:
        description: Publish the already-qualified GitHub release
        required: true
        default: false
        type: boolean
      staging_ref:
        description: Pre-created tag used for a safe replacement of an existing public release
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build manifest-driven artifacts
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install declared dependencies
        run: >-
          dnf install -y breeze-icon-theme cmake ffmpeg-free gcc-c++ git
          glibc-langpack-en google-noto-sans-fonts ImageMagick kf6-kirigami
          kf6-kpackage
          libasan libubsan ninja-build plasma-workspace python3
          qt6-qtbase-devel qt6-qtdeclarative-devel rpm-build rpmlint xz
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate exact tag and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('distribution/release-manifest.json').read_text())
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit(f'public releases require stable VERSION, got {version}')
          if version != manifest['release']['stableVersion'] or '${{ inputs.ref }}' != f'v{version}':
              raise SystemExit('tag, VERSION, and manifest stableVersion do not match')
          requested_ref = '${{ inputs.ref }}'
          exact = subprocess.check_output(
              [
                  'git',
                  '-c',
                  'safe.directory=' + str(Path.cwd()),
                  'rev-parse',
                  f'refs/tags/{requested_ref}^{{commit}}',
              ],
              text=True,
          ).strip()
          head = subprocess.check_output(
              ['git', '-c', 'safe.directory=' + str(Path.cwd()), 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          if exact != head:
              raise SystemExit('checkout is not the exact requested tag')
          PY
          python3 scripts/validate_release_manifest.py
          python3 scripts/sync_version.py --check
          echo "NOXFORGE_VERSION=$(<VERSION)" >> "$GITHUB_ENV"
      - name: Run the full release gate
        run: python3 scripts/release-check.py
      - name: Build source, portable, and Fedora artifacts
        shell: bash
        run: |
          python3 scripts/build.py --mode all --skip-tests
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} release
          source_archive=$(python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('distribution/release-manifest.json').read_text())
          print(next(x['filename'] for x in m['artifacts'] if x['key']=='source'))
          PY
          )
          cp "dist/${source_archive}" rpmbuild/SOURCES/
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" packaging/noxforge.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" packaging/noxforge.spec
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path
          manifest=json.loads(Path('distribution/release-manifest.json').read_text())
          release=Path('release')
          evidence_root=Path(manifest['evidence']['activeRoot'])
          release_ref='${{ inputs.ref }}'
          source_commit=subprocess.check_output(
              ['git', '-c', 'safe.directory=' + str(Path.cwd()), 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          for artifact in manifest['artifacts']:
              kind=artifact['kind']
              filename=artifact['filename']
              if kind in {'source', 'portable', 'store'}:
                  source=Path('dist') / filename
              elif kind == 'rpm':
                  source=Path('rpmbuild/RPMS') / 'x86_64' / filename
              elif kind == 'srpm':
                  source=Path('rpmbuild/SRPMS') / filename
              elif kind == 'evidence':
                  source=evidence_root / filename
              else:
                  raise SystemExit(f'unsupported manifest artifact kind: {kind}')
              if not source.is_file():
                  raise SystemExit(f'missing manifest artifact source: {source}')
              if filename == 'qualification.json':
                  qualification=json.loads(source.read_text())
                  qualification['releaseState']='release'
                  qualification['releaseReady']=True
                  qualification.setdefault('candidate', {}).update({
                      'version': Path('VERSION').read_text().strip(),
                      'sourceRef': release_ref,
                      'sourceCommit': source_commit,
                      'worktreeDirty': False,
                  })
                  (release / filename).write_text(json.dumps(qualification, indent=2) + '\n')
              elif filename == 'automated-gate.md':
                  lines=[
                      line for line in source.read_text().splitlines()
                      if not line.startswith(('Version: ', 'Commit: ', 'Release state: '))
                  ]
                  (release / filename).write_text(
                      '\n'.join(lines).rstrip()
                      + f"\n\nVersion: {Path('VERSION').read_text().strip()}\n"
                      + f"Commit: {source_commit}\nRelease state: release\n"
                  )
              else:
                  shutil.copy2(source, release / filename)
          expected={item['filename'] for item in manifest['artifacts']}
          actual={path.name for path in release.iterdir() if path.is_file()}
          if not expected <= actual:
              raise SystemExit(f'missing manifest payloads: {sorted(expected-actual)}')
          for path in release.iterdir():
              if path.is_file() and path.name != 'SHA256SUMS':
                  pass
          (release/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(release.iterdir()) if path.is_file() and path.name != 'SHA256SUMS'))
          PY
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: noxforge-${{ inputs.ref }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish-github:
    name: Publish approved manifest payload
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: noxforge-${{ inputs.ref }}
          path: release
      - name: Verify checksums and manifest payload count
        shell: bash
        env:
          NOXFORGE_RELEASE_REF: ${{ inputs.ref }}
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('distribution/release-manifest.json').read_text())
          files={p.name for p in Path('release').iterdir() if p.is_file() and p.name != 'SHA256SUMS'}
          required={item['filename'] for item in m['artifacts']}
          if not required <= files:
              raise SystemExit(f'missing manifest payloads: {sorted(required-files)}')
          PY
          version="$NOXFORGE_RELEASE_REF"
          version="${version#v}"
          echo "NOXFORGE_NOTES_FILE=docs/releases/v${version}.md" >> "$GITHUB_ENV"
      - name: Publish exact approved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NOXFORGE_RELEASE_REF: ${{ inputs.ref }}
          NOXFORGE_STAGING_REF: ${{ inputs.staging_ref }}
        run: |
          validate_bundle() {
            local bundle_dir="$1"
            (cd "$bundle_dir" && sha256sum --check SHA256SUMS)
            python3 - "$bundle_dir" <<'PY'
          import json
          import sys
          from pathlib import Path
          bundle=Path(sys.argv[1])
          manifest=json.loads(Path('distribution/release-manifest.json').read_text())
          expected={item['filename'] for item in manifest['artifacts']} | {'SHA256SUMS'}
          actual={path.name for path in bundle.iterdir() if path.is_file()}
          if actual != expected:
              raise SystemExit(f'non-manifest release payload: extra={sorted(actual-expected)} missing={sorted(expected-actual)}')
          PY
          }

          reject_extra_remote_assets() {
            local ref="$1"
            python3 - "$ref" <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          ref=sys.argv[1]
          manifest=json.loads(Path('distribution/release-manifest.json').read_text())
          expected={item['filename'] for item in manifest['artifacts']} | {'SHA256SUMS'}
          payload=json.loads(subprocess.check_output(['gh', 'release', 'view', ref, '--json', 'assets'], text=True))
          actual={asset['name'] for asset in payload['assets']}
          extra=actual-expected
          if extra:
              raise SystemExit(f'existing release has non-manifest assets: {sorted(extra)}')
          PY
          }

          if gh release view "$NOXFORGE_RELEASE_REF" >/dev/null 2>&1; then
            is_draft="$(gh release view "$NOXFORGE_RELEASE_REF" --json isDraft --jq '.isDraft')"
            if [[ "$is_draft" == "true" ]]; then
              reject_extra_remote_assets "$NOXFORGE_RELEASE_REF"
              gh release upload "$NOXFORGE_RELEASE_REF" release/* --clobber
              gh release edit "$NOXFORGE_RELEASE_REF" --draft=false --title "NoxForge $NOXFORGE_RELEASE_REF" --notes-file "$NOXFORGE_NOTES_FILE"
              final_dir="$(mktemp -d)"
              gh release download "$NOXFORGE_RELEASE_REF" --dir "$final_dir"
              validate_bundle "$final_dir"
            else
              staging_ref="$NOXFORGE_STAGING_REF"
              if [[ -z "$staging_ref" ]]; then
                echo 'safe replacement requires a pre-created staging_ref input' >&2
                exit 1
              fi
              if [[ "$staging_ref" == "$NOXFORGE_RELEASE_REF" ]]; then
                echo 'staging_ref must differ from the release ref' >&2
                exit 1
              fi
              if ! git ls-remote --exit-code origin "refs/tags/$staging_ref" >/dev/null 2>&1; then
                echo "staging tag does not exist: $staging_ref" >&2
                exit 1
              fi
              git fetch origin "refs/tags/$staging_ref:refs/tags/$staging_ref"
              release_commit="$(git rev-parse "refs/tags/$NOXFORGE_RELEASE_REF^{commit}")"
              staging_commit="$(git rev-parse "refs/tags/$staging_ref^{commit}")"
              if [[ "$staging_commit" != "$release_commit" ]]; then
                echo "staging tag does not resolve to the release commit: $staging_ref" >&2
                exit 1
              fi
              if gh release view "$staging_ref" >/dev/null 2>&1; then
                gh release delete "$staging_ref" --yes
              fi
              gh release create "$staging_ref" release/* --draft --verify-tag \
                --title "NoxForge $NOXFORGE_RELEASE_REF staging" \
                --notes-file "$NOXFORGE_NOTES_FILE"
              gh release edit "$staging_ref" --draft=false
              staging_dir="$(mktemp -d)"
              gh release download "$staging_ref" --dir "$staging_dir"
              validate_bundle "$staging_dir"
              gh release delete "$NOXFORGE_RELEASE_REF" --yes
              gh release create "$NOXFORGE_RELEASE_REF" release/* --verify-tag \
                --title "NoxForge $NOXFORGE_RELEASE_REF" \
                --notes-file "$NOXFORGE_NOTES_FILE"
              final_dir="$(mktemp -d)"
              gh release download "$NOXFORGE_RELEASE_REF" --dir "$final_dir"
              validate_bundle "$final_dir"
              gh release delete "$staging_ref" --yes
            fi
          else
            if [[ -n "$NOXFORGE_STAGING_REF" ]] && gh release view "$NOXFORGE_STAGING_REF" >/dev/null 2>&1; then
              gh release delete "$NOXFORGE_STAGING_REF" --yes
            fi
            gh release create "$NOXFORGE_RELEASE_REF" release/* --verify-tag \
              --title "NoxForge $NOXFORGE_RELEASE_REF" \
              --notes-file "$NOXFORGE_NOTES_FILE"
            final_dir="$(mktemp -d)"
            gh release download "$NOXFORGE_RELEASE_REF" --dir "$final_dir"
            validate_bundle "$final_dir"
          fi
