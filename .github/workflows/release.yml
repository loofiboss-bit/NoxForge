name: Release candidate

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact signed or annotated release tag
        required: true
        type: string
      publish:
        description: Publish the already-qualified GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build manifest-driven artifacts
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install declared dependencies
        run: >-
          dnf install -y breeze-icon-theme cmake ffmpeg-free gcc-c++ git
          glibc-langpack-en google-noto-sans-fonts ImageMagick kf6-kirigami
          kf6-kpackage
          libasan libubsan ninja-build plasma-workspace python3
          qt6-qtbase-devel qt6-qtdeclarative-devel rpm-build rpmlint xz
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Validate exact tag and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('distribution/release-manifest.json').read_text())
          version = Path('VERSION').read_text().strip()
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit(f'public releases require stable VERSION, got {version}')
          if version != manifest['release']['stableVersion'] or '${{ inputs.ref }}' != f'v{version}':
              raise SystemExit('tag, VERSION, and manifest stableVersion do not match')
          exact = subprocess.check_output(['git', '-c', 'safe.directory=' + str(Path.cwd()), 'describe', '--tags', '--exact-match'], text=True).strip()
          if exact != f'v{version}':
              raise SystemExit('checkout is not the exact requested tag')
          PY
          python3 scripts/validate_release_manifest.py
          python3 scripts/sync_version.py --check
          echo "NOXFORGE_VERSION=$(<VERSION)" >> "$GITHUB_ENV"
      - name: Run the full release gate
        run: python3 scripts/release-check.py
      - name: Build source, portable, and Fedora artifacts
        shell: bash
        run: |
          python3 scripts/build.py --mode all --skip-tests
          mkdir -p rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} release
          source_archive=$(python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('distribution/release-manifest.json').read_text())
          print(next(x['filename'] for x in m['artifacts'] if x['key']=='source'))
          PY
          )
          cp "dist/${source_archive}" rpmbuild/SOURCES/
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" packaging/noxforge.spec
          rpmbuild -bs --define "_topdir $PWD/rpmbuild" packaging/noxforge.spec
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import subprocess
          from pathlib import Path
          manifest=json.loads(Path('distribution/release-manifest.json').read_text())
          release=Path('release')
          evidence_root=Path(manifest['evidence']['activeRoot'])
          release_ref='${{ inputs.ref }}'
          source_commit=subprocess.check_output(
              ['git', '-c', 'safe.directory=' + str(Path.cwd()), 'rev-parse', 'HEAD'],
              text=True,
          ).strip()
          for artifact in manifest['artifacts']:
              kind=artifact['kind']
              filename=artifact['filename']
              if kind in {'source', 'portable', 'store'}:
                  source=Path('dist') / filename
              elif kind == 'rpm':
                  source=Path('rpmbuild/RPMS') / 'x86_64' / filename
              elif kind == 'srpm':
                  source=Path('rpmbuild/SRPMS') / filename
              elif kind == 'evidence':
                  source=evidence_root / filename
              else:
                  raise SystemExit(f'unsupported manifest artifact kind: {kind}')
              if not source.is_file():
                  raise SystemExit(f'missing manifest artifact source: {source}')
              if filename == 'qualification.json':
                  qualification=json.loads(source.read_text())
                  qualification['releaseState']='release'
                  qualification['releaseReady']=True
                  qualification.setdefault('candidate', {}).update({
                      'version': Path('VERSION').read_text().strip(),
                      'sourceRef': release_ref,
                      'sourceCommit': source_commit,
                      'worktreeDirty': False,
                  })
                  (release / filename).write_text(json.dumps(qualification, indent=2) + '\\n')
              elif filename == 'automated-gate.md':
                  lines=[
                      line for line in source.read_text().splitlines()
                      if not line.startswith(('Version: ', 'Commit: ', 'Release state: '))
                  ]
                  (release / filename).write_text(
                      '\\n'.join(lines).rstrip()
                      + f"\\n\\nVersion: {Path('VERSION').read_text().strip()}\\n"
                      + f"Commit: {source_commit}\\nRelease state: release\\n"
                  )
              else:
                  shutil.copy2(source, release / filename)
          expected={item['filename'] for item in manifest['artifacts']}
          actual={path.name for path in release.iterdir() if path.is_file()}
          if not expected <= actual:
              raise SystemExit(f'missing manifest payloads: {sorted(expected-actual)}')
          for path in release.iterdir():
              if path.is_file() and path.name != 'SHA256SUMS':
                  pass
          (release/'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n' for path in sorted(release.iterdir()) if path.is_file() and path.name != 'SHA256SUMS'))
          PY
          (cd release && sha256sum --check SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: noxforge-${{ inputs.ref }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish-github:
    name: Publish approved manifest payload
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: noxforge-${{ inputs.ref }}
          path: release
      - name: Verify checksums and manifest payload count
        shell: bash
        run: |
          (cd release && sha256sum --check SHA256SUMS)
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('distribution/release-manifest.json').read_text())
          files={p.name for p in Path('release').iterdir() if p.is_file() and p.name != 'SHA256SUMS'}
          required={item['filename'] for item in m['artifacts']}
          if not required <= files:
              raise SystemExit(f'missing manifest payloads: {sorted(required-files)}')
          PY
          version="${{ inputs.ref }}"
          version="${version#v}"
          echo "NOXFORGE_NOTES_FILE=docs/releases/v${version}.md" >> "$GITHUB_ENV"
      - name: Publish exact approved artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.ref }}" release/* --verify-tag
          --title "NoxForge ${{ inputs.ref }}" --notes-file "$NOXFORGE_NOTES_FILE"
