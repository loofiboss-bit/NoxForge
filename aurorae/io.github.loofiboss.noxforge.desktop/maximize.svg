<svg xmlns="http://www.w3.org/2000/svg" width="256" height="24" viewBox="0 0 256 24">
  <defs>
    <style id="current-color-scheme" type="text/css"><![CDATA[
      .ColorScheme-Text { color: #E8F0F2; }
      .ColorScheme-Hover { color: #283942; }
      .ColorScheme-Pressed { color: #223429; }
    ]]></style>
  </defs>
  <g id="active-center" transform="translate(0 0)" class="ColorScheme-Text" color="#E8F0F2">
      <rect width="24" height="24" rx="4" fill="currentColor" fill-opacity="0"/>
      
      <g fill="none" stroke="#E8F0F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></g>
    </g>
  <g id="inactive-center" transform="translate(32 0)" class="ColorScheme-Text" color="#E8F0F2">
      <rect width="24" height="24" rx="4" fill="currentColor" fill-opacity="0"/>
      
      <g fill="none" stroke="#A6B4B9" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></g>
    </g>
  <g id="hover-center" transform="translate(64 0)" class="ColorScheme-Hover" color="#E8F0F2">
      <rect width="24" height="24" rx="4" fill="currentColor" fill-opacity="0.85"/>
      <rect x="0.5" y="0.5" width="23" height="23" rx="4" fill="none" stroke="#4B606A" stroke-width="1" stroke-opacity="0.6"/>
      <g fill="none" stroke="#E8F0F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></g>
    </g>
