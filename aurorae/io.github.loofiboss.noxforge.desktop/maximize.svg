    </g>
  <g id="pressed-center" transform="translate(128 0)" class="ColorScheme-Pressed" color="#E8F0F2">
      <rect width="24" height="24" rx="4" fill="currentColor" fill-opacity="1"/>
      <rect x="0.5" y="0.5" width="23" height="23" rx="4" fill="none" stroke="#4B606A" stroke-width="1" stroke-opacity="0.6"/>
      <g fill="none" stroke="#E8F0F2" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></g>
    </g>
