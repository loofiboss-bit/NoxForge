<svg xmlns="http://www.w3.org/2000/svg" width="3440" height="1440" viewBox="0 0 3440 1440">
  <title>NoxForge Ultrawide Forge Identity relay planes</title>
  <defs>
    <linearGradient id="canvas-wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121D25"/>
      <stop offset="0.42" stop-color="#0B141B"/>
      <stop offset="1" stop-color="#070B0F"/>
    </linearGradient>
    <linearGradient id="plate-wide" x1="0" y1="0" x2="1" y2="0">
