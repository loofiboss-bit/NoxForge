<svg xmlns="http://www.w3.org/2000/svg" width="3440" height="1440" viewBox="0 0 3440 1440">
  <title>NoxForge Lumina Precision 21:9 Ultrawide wallpaper</title>
  <defs>
    <!-- Deep atmospheric space gradients -->
    <linearGradient id="bg-canvas-wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141E26"/>
      <stop offset="35%" stop-color="#0E151B"/>
      <stop offset="70%" stop-color="#090E12"/>
      <stop offset="100%" stop-color="#050709"/>
    </linearGradient>

    <!-- Obsidian layered plate gradients -->
    <linearGradient id="plate-grad-1-wide" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1F2E3A"/>
      <stop offset="60%" stop-color="#131C23"/>
      <stop offset="100%" stop-color="#0C1217"/>
    </linearGradient>

    <linearGradient id="plate-grad-2-wide" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#1A2731"/>
      <stop offset="50%" stop-color="#121B21"/>
      <stop offset="100%" stop-color="#0A0F13"/>
    </linearGradient>

    <linearGradient id="plate-grad-3-wide" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#16212A"/>
      <stop offset="100%" stop-color="#0B1014"/>
    </linearGradient>

    <!-- Lumina accent gradient -->
    <linearGradient id="lumina-glow-wide" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#4EFA8B" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#22D3EE" stop-opacity="0.80"/>
      <stop offset="85%" stop-color="#38BDF8" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Precision rim light gradients -->
    <linearGradient id="rim-highlight-wide" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#647E8D" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#4B606A" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1F2E3A" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rim-highlight-glow" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4EFA8B" stop-opacity="0.7"/>
      <stop offset="30%" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#4B606A" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1B2831" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial atmospheric bloom -->
    <radialGradient id="bloom-left-wide" cx="15%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#1A3328" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#0E212A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. Deep space canvas -->
  <rect width="3440" height="1440" fill="url(#bg-canvas-wide)"/>

  <!-- 2. Ambient atmosphere bloom -->
  <rect width="3440" height="1440" fill="url(#bloom-left-wide)"/>

  <!-- 3. Fine technical precision grid & isobars (subtle micro-lines) -->
  <g fill="none" stroke="#263845" stroke-width="1" opacity="0.18">
    <circle cx="600" cy="550" r="400"/>
    <circle cx="600" cy="550" r="750"/>
    <circle cx="600" cy="550" r="1150"/>
  </g>

  <!-- 4. Deep foundation planes -->
  <path d="M0 0H740L1140 560L920 740L0 280Z" fill="url(#plate-grad-3-wide)" opacity="0.95"/>
  <path d="M0 240L840 710L1260 610L1520 790L1080 920L0 540Z" fill="url(#plate-grad-1-wide)"/>
  <path d="M0 510L960 880L1410 1340L1140 1440H0Z" fill="url(#plate-grad-2-wide)"/>

  <!-- 5. Sculpted architectural mid-planes -->
  <path d="M0 720L740 960L1310 1440H860L560 1140L0 1020Z" fill="#131C24"/>
  <path d="M0 1010L510 1140L790 1440H0Z" fill="#0C1217"/>

  <!-- 6. Panoramic center relay plane (keeps ultrawide spacious) -->
  <path d="M1480 320L2120 220L2780 460L2560 610L1820 560Z" fill="#141E26" opacity="0.85"/>
  <path d="M1640 580L2520 630L2860 820L2610 920L1880 840Z" fill="#0F1820" opacity="0.75"/>

  <!-- 7. Sweeping flowing contour ribbons -->
  <path d="M0 320 Q 610 620 910 530 T 1380 680" fill="none" stroke="url(#rim-highlight-wide)" stroke-width="1.5" opacity="0.75"/>
  <path d="M0 480 Q 750 820 1100 760 T 1660 890" fill="none" stroke="url(#rim-highlight-wide)" stroke-width="1.5" opacity="0.55"/>
  <path d="M1480 320 Q 2120 220 2780 460" fill="none" stroke="url(#rim-highlight-wide)" stroke-width="1.5" opacity="0.45"/>

  <!-- 8. Lumina Mint & Cyan Core Energy Seams -->
  <path d="M640 0 H658 L1060 550 L1038 568 Z" fill="url(#lumina-glow-wide)"/>
  <path d="M1038 568 L1062 556 L1262 590 L1240 600 Z" fill="url(#lumina-glow-wide)" opacity="0.85"/>
  <path d="M1240 600 L1260 592 L1490 760 L1470 774 Z" fill="url(#lumina-glow-wide)" opacity="0.65"/>

  <!-- Secondary subtle relay beam for ultrawide balance -->
  <path d="M1820 0 H1836 L2090 410 L2072 422 Z" fill="url(#lumina-glow-wide)" opacity="0.45"/>

  <!-- 9. Precision edge highlights -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 240L840 710L1260 610" stroke="url(#rim-highlight-glow)" stroke-width="2" opacity="0.85"/>
    <path d="M840 710L1080 920" stroke="url(#rim-highlight-wide)" stroke-width="1.5" opacity="0.6"/>
    <path d="M0 510L960 880L1410 1340" stroke="url(#rim-highlight-wide)" stroke-width="2" opacity="0.5"/>
    <path d="M1480 320L2120 220L2780 460" stroke="url(#rim-highlight-wide)" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- 10. Minimal technical coordinates -->
  <g fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.55" stroke-linecap="round">
    <path d="M330 810 L480 852"/>
    <path d="M920 1060 L1010 1130"/>
    <path d="M1310 680 L1370 665"/>
    <path d="M2240 780 L2390 810"/>
  </g>
  <g fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.4" stroke-linecap="round">
    <path d="M980 1140 L1060 1205"/>
  </g>
</svg>
