<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <title>NoxForge Obsidian OLED Architectural 16:9 wallpaper</title>
  <defs>
    <!-- Pure pitch-black OLED foundation (>85% #000000) -->
    <linearGradient id="plate-grad-1" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#0B1116"/>
      <stop offset="55%" stop-color="#05080B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="plate-grad-2" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#0E161C"/>
      <stop offset="45%" stop-color="#060A0D"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <linearGradient id="plate-grad-3" x1="0.4" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#080D11"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Energy beam and lumina accent gradient (filter-free stepped precision) -->
    <linearGradient id="lumina-glow" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#A3FF47" stop-opacity="0.96"/>
      <stop offset="48%" stop-color="#22D3EE" stop-opacity="0.72"/>
      <stop offset="88%" stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lumina-glow-subtle" x1="0" y1="0" x2="0.9" y2="0.9">
      <stop offset="0%" stop-color="#A3FF47" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#22D3EE" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="rim-obsidian" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0%" stop-color="#354852" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#1B2831" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Pure OLED #000000 canvas -->
  <rect width="2560" height="1440" fill="#000000"/>

  <!-- 2. Left-anchored obsidian monolith facets preserving true black right/center workspace -->
  <path d="M0 0H590L940 530L740 695L0 260Z" fill="url(#plate-grad-3)"/>
  <path d="M0 245L700 680L1060 590L1280 770L890 910L0 520Z" fill="url(#plate-grad-1)"/>
  <path d="M0 510L790 865L1160 1320L920 1440H0Z" fill="url(#plate-grad-2)"/>
  <path d="M0 780L560 990L980 1440H650L400 1160L0 1040Z" fill="#05080A"/>

  <!-- 3. Subtle architectural coordinate arcs -->
  <g fill="none" stroke="#18242C" stroke-width="1" opacity="0.35">
    <circle cx="480" cy="540" r="420"/>
    <circle cx="480" cy="540" r="720"/>
    <circle cx="480" cy="540" r="1060"/>
  </g>

  <!-- 4. Multi-stepped filter-free Forge energy seam -->
  <path d="M518 0H582L942 544L866 584Z" fill="url(#lumina-glow-subtle)" opacity="0.45"/>
  <path d="M538 0H556L902 542L882 558Z" fill="url(#lumina-glow)"/>
  <path d="M882 558L906 546L1066 582L1044 592Z" fill="url(#lumina-glow)" opacity="0.82"/>
  <path d="M1044 592L1064 584L1260 756L1242 768Z" fill="url(#lumina-glow)" opacity="0.58"/>

  <!-- 5. Crisp 1px architectural bevel highlights -->
  <g fill="none" stroke-linecap="round">
    <path d="M0 245L700 680L1060 590L1280 770" stroke="url(#rim-obsidian)" stroke-width="1.5"/>
    <path d="M0 510L790 865L1160 1320" stroke="url(#rim-obsidian)" stroke-width="1.2"/>
    <path d="M0 780L560 990L980 1440" stroke="#1F2E3A" stroke-width="1" opacity="0.55"/>
  </g>

  <!-- 6. Precision Forge Notch telemetry markers -->
  <polygon points="882,554 892,544 904,544 904,558 882,558" fill="#A3FF47" opacity="0.9"/>
  <g fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.48" stroke-linecap="round">
    <path d="M270 800L396 842"/>
    <path d="M775 1050L852 1122"/>
  </g>
  <line x1="825" y1="1135" x2="895" y2="1198" stroke="#A78BFA" stroke-width="2" opacity="0.38" stroke-linecap="round"/>
</svg>
